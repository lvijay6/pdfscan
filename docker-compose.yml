version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdfscanner-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pdfscanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pdfscanner-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pdfscanner-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/pdfscanner
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_pdfscanner_key_2026
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pdfscanner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
